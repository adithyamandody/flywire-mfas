<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="white"/>
<text x="24" y="30" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b">How much of a nervous system no hierarchy can explain</text>
<text x="24" y="50" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a8a8a">Each bar spans a proven floor and an achieved ceiling. Connections of at least two synapses.</text>
<line x1="212.0" y1="64" x2="212.0" y2="304" stroke="#d8d8d8" stroke-width="1"/>
<text x="212.0" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">0%</text>
<line x1="326.2" y1="64" x2="326.2" y2="304" stroke="#d8d8d8" stroke-width="1"/>
<text x="326.2" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">5%</text>
<line x1="440.3" y1="64" x2="440.3" y2="304" stroke="#d8d8d8" stroke-width="1"/>
<text x="440.3" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">10%</text>
<line x1="554.5" y1="64" x2="554.5" y2="304" stroke="#d8d8d8" stroke-width="1"/>
<text x="554.5" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">15%</text>
<line x1="668.7" y1="64" x2="668.7" y2="304" stroke="#d8d8d8" stroke-width="1"/>
<text x="668.7" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">20%</text>
<text x="486" y="344" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle">irreducible recurrence (share of synaptic weight backward in every possible ordering)</text>
<text x="200" y="80" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end">C. elegans, whole</text>
<text x="200" y="96" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end">297 cells</text>
<path d="M 299.0 71 l 8 8 l -8 8 l -8 -8 z" fill="#2d6a9f"/>
<text x="313.0" y="82" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2d6a9f">3.81%  exact</text>
<text x="200" y="132" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end">D. larva, whole brain</text>
<text x="200" y="148" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end">2,923 cells</text>
<rect x="481.2" y="123" width="30.0" height="14" rx="2" fill="#2d6a9f" opacity="0.5"/>
<line x1="481.2" y1="121" x2="481.2" y2="139" stroke="#2d6a9f" stroke-width="2.5"/>
<line x1="511.2" y1="121" x2="511.2" y2="139" stroke="#2d6a9f" stroke-width="2.5"/>
<text x="521.2" y="134" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2d6a9f">11.79 – 13.11%</text>
<text x="200" y="184" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end">D. adult, central brain</text>
<text x="200" y="200" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end">21,737 cells</text>
<rect x="644.8" y="175" width="43.6" height="14" rx="2" fill="#2d6a9f" opacity="0.5"/>
<line x1="644.8" y1="173" x2="644.8" y2="191" stroke="#2d6a9f" stroke-width="2.5"/>
<line x1="688.5" y1="173" x2="688.5" y2="191" stroke="#2d6a9f" stroke-width="2.5"/>
<text x="698.5" y="186" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2d6a9f">18.96 – 20.87%</text>
<text x="200" y="236" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end">D. adult, whole brain</text>
<text x="200" y="252" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end">136,648 cells</text>
<rect x="434.8" y="227" width="123.7" height="14" rx="2" fill="#b5562c" opacity="0.5"/>
<line x1="434.8" y1="225" x2="434.8" y2="243" stroke="#b5562c" stroke-width="2.5"/>
<line x1="558.5" y1="225" x2="558.5" y2="243" stroke="#b5562c" stroke-width="2.5"/>
<text x="568.5" y="238" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#b5562c">9.76 – 15.18%</text>
<text x="200" y="266" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#b5562c" text-anchor="end">includes the optic lobes</text>
</svg>